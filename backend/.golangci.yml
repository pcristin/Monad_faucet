run:
  timeout: 5m
  go: "1.23"

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  govet:
    enable-all: false
    enable:
      - assign
      - atomic
      - bools
      - buildtag
      - copylocks
      - nilfunc
      - printf
      - shift
      - tests
      - unreachable
    disable:
      - shadow
  gofmt:
    simplify: false

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    # Exclude all errors from rollback checks since they're often intentionally ignored
    - text: "Error return value of `.*\\.Rollback` is not checked"
      linters:
        - errcheck
    # Exclude cleanup/shutdown function error checks that are often intentionally ignored
    - text: "Error return value of `.*\\.Stop` is not checked"
      linters:
        - errcheck
    - text: "Error return value of `.*SyncDepositorPauseStates` is not checked"
      linters:
        - errcheck
    # Exclude init function warnings  
    - text: "don't use `init` function"
      linters:
        - gochecknoinits
  max-issues-per-linter: 10
  max-same-issues: 3 