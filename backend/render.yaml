services:
  - type: web
    name: monad-faucet
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/info
    envVars:
      - key: PORT
        value: 8080
      - key: ARB_RPC_URL
        sync: true
      - key: MONAD_RPC_URL
        sync: true
      - key: WALLET_PRIVATE_KEY
        sync: true
      - key: ADMIN_API_KEY_1
        sync: true
      - key: ADMIN_API_KEY_2
        sync: true
      # Add other environment variables as needed
      # - key: ETH_NODE_URL
      #   sync: false # This means you'll set it manually in the Render dashboard
      # - key: MONAD_NODE_URL
      #   sync: false 