name: CI

on:
  push:
    branches: [ main, stage ]
  pull_request:
    branches: [ main, stage ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bridgedb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      working-directory: ./backend
      run: go mod download

    - name: Verify dependencies
      working-directory: ./backend
      run: go mod verify

    - name: Run go vet
      working-directory: ./backend
      run: go vet ./...

    - name: Run go fmt check
      working-directory: ./backend
      run: |
        unformatted=$(gofmt -s -l . 2>/dev/null | grep -v vendor/ | head -10)
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted (showing first 10):"
          echo "$unformatted"
          echo "Run 'gofmt -s -w .' to fix formatting"
          exit 1
        fi

    - name: Run tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/bridgedb_test?sslmode=disable
        ARB_RPC_URL: ${{ secrets.ARB_RPC_URL != '' && secrets.ARB_RPC_URL || 'https://arb1.arbitrum.io/rpc' }}
        MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL != '' && secrets.MONAD_RPC_URL || 'https://rpc-testnet.monad.xyz/' }}
        WALLET_PRIVATE_KEY: ${{ secrets.TEST_WALLET_PRIVATE_KEY != '' && secrets.TEST_WALLET_PRIVATE_KEY || '0x1234567890123456789012345678901234567890123456789012345678901234' }}
        ARB_DEPOSITOR_ADDRESS: "0x487177C3278FAA36dd317DBB4CA97425a4F4Ee31"
        MONAD_DISTRIBUTOR_ADDRESS: "0xc11350Fd29aC48181b0117bd1935dBE781cdd03d"
        ADMIN_API_KEY_1: "test-admin-key"
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Generate coverage report
      working-directory: ./backend
      run: go tool cover -html=coverage.out -o coverage.html

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: backend/coverage.html

    - name: Build application
      working-directory: ./backend
      run: go build -v -o faucet ./cmd/faucet

    - name: Test binary execution
      working-directory: ./backend
      run: |
        if ./faucet --help >/dev/null 2>&1 || ./faucet -h >/dev/null 2>&1; then
          echo "Binary executable and responds to help flags"
        else
          echo "Testing basic binary execution..."
          file ./faucet
          ls -la ./faucet
        fi

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile
        push: false
        tags: monad-faucet:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the build on linter issues
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        working-directory: ./backend
        args: --timeout=2m --max-issues-per-linter=5 --max-same-issues=2 