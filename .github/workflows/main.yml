name: Performance Regression Check

on:
  pull_request:
    branches: [ stage ]
  push:
    branches: [ stage ]

jobs:
  profile-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Need history to get previous commit

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.23'

      - name: Pull PostgreSQL image (for local testing)
        run: docker pull postgres:15-alpine

      - name: Run profile test on current commit
        id: current_test
        run: |
          # Create working directory for timing results
          mkdir -p /tmp/profile_results
          
          # Check if profile directory exists
          if [ ! -d "backend/tests/profile" ]; then
            echo "::warning::Profile test directory doesn't exist in current commit"
            echo "10s" > /tmp/profile_results/current_time.txt
            exit 0
          fi
          
          # Run the profile test, but don't fail if it errors
          cd backend/tests/profile || exit 0
          
          # First check if main.go exists
          if [ ! -f "main.go" ]; then
            echo "::warning::main.go doesn't exist in backend/tests/profile"
            echo "10s" > /tmp/profile_results/current_time.txt
            exit 0
          fi
          
          # Run the test with output to a log file and show output
          echo "::group::Test Output"
          go run main.go | tee test_output.log || echo "Profile test failed but continuing workflow"
          echo "::endgroup::"
          
          # Debug: Show log file contents
          echo "::group::Log File Contents"
          cat test_output.log
          echo "::endgroup::"
          
          # Look for timing patterns with multiple formats
          if grep -E "Total test duration:|Processing time:|Duration:|Completed in" test_output.log; then
            # Extract time value with flexible pattern
            time_value=$(grep -E "Total test duration:|Processing time:|Duration:|Completed in" test_output.log | head -1 | grep -oE '[0-9]+(\.[0-9]+)?s')
            
            if [[ -n "$time_value" ]]; then
              echo "Found time: $time_value"
              echo "$time_value" > /tmp/profile_results/current_time.txt
            else
              echo "::warning::Time found but couldn't extract value, using default"
              echo "10s" > /tmp/profile_results/current_time.txt
            fi
          else
            echo "::warning::No time found in logs, using default"
            echo "10s" > /tmp/profile_results/current_time.txt
          fi
          
          # Show the result
          echo "Current test duration:"
          cat /tmp/profile_results/current_time.txt

      - name: Checkout previous commit
        run: |
          # Get previous commit SHA and checkout directly
          git checkout $(git rev-parse HEAD~1) || echo "Failed to checkout previous commit, using current instead"

      - name: Run profile test on previous commit
        id: previous_test
        run: |
          # Check if profile directory exists
          if [ ! -d "backend/tests/profile" ]; then
            echo "::warning::Profile test directory doesn't exist in previous commit"
            echo "10s" > /tmp/profile_results/previous_time.txt
            exit 0
          fi
          
          # First check if main.go exists to avoid errors
          if [ ! -f "backend/tests/profile/main.go" ]; then
            echo "::warning::main.go doesn't exist in backend/tests/profile in the previous commit"
            echo "10s" > /tmp/profile_results/previous_time.txt
            exit 0
          fi
          
          # Run the profile test with better error capture
          cd backend/tests/profile || exit 0
          
          # Try to compile first to check for errors
          if ! go build -o /tmp/profile_test main.go; then
            echo "::warning::Compilation failed in previous commit"
            echo "10s" > /tmp/profile_results/previous_time.txt
            exit 0
          fi
          
          # Run the compiled binary with output to a log file and show output
          echo "::group::Test Output (Previous Commit)"
          /tmp/profile_test | tee test_output.log || {
            echo "::warning::Previous commit test failed with exit code $?"
            echo "Last 20 lines of the log:"
            tail -20 test_output.log || echo "No log output"
            echo "Profile test failed but continuing workflow"
            echo "10s" > /tmp/profile_results/previous_time.txt
            exit 0
          }
          echo "::endgroup::"
          
          # Debug: Show log file contents
          echo "::group::Log File Contents (Previous Commit)"
          cat test_output.log
          echo "::endgroup::"
          
          # Look for timing patterns with multiple formats
          if grep -E "Total test duration:|Processing time:|Duration:|Completed in" test_output.log; then
            # Extract time value with flexible pattern
            time_value=$(grep -E "Total test duration:|Processing time:|Duration:|Completed in" test_output.log | head -1 | grep -oE '[0-9]+(\.[0-9]+)?s')
            
            if [[ -n "$time_value" ]]; then
              echo "Found time: $time_value"
              echo "$time_value" > /tmp/profile_results/previous_time.txt
            else
              echo "::warning::Time found but couldn't extract value, using default"
              echo "10s" > /tmp/profile_results/previous_time.txt
            fi
          else
            echo "::warning::No time found in logs, using default"
            echo "10s" > /tmp/profile_results/previous_time.txt
          fi
          
          # Show the result
          echo "Previous test duration:"
          cat /tmp/profile_results/previous_time.txt

      - name: Checkout back to current commit
        run: |
          git checkout ${{ github.sha }}

      - name: Compare processing times
        run: |
          # Verify timing files exist, otherwise create defaults
          if [ ! -f "/tmp/profile_results/current_time.txt" ]; then
            echo "10s" > /tmp/profile_results/current_time.txt
          fi
          
          if [ ! -f "/tmp/profile_results/previous_time.txt" ]; then
            echo "10s" > /tmp/profile_results/previous_time.txt
          fi
          
          # Get the time values
          current_time=$(cat /tmp/profile_results/current_time.txt)
          previous_time=$(cat /tmp/profile_results/previous_time.txt)
          
          # Convert time strings to milliseconds for comparison
          current_ms=$(echo $current_time | sed 's/s$//' | awk '{print $1 * 1000}')
          previous_ms=$(echo $previous_time | sed 's/s$//' | awk '{print $1 * 1000}')
          
          # Validate and handle zero values
          if [[ "$current_ms" == "0" || -z "$current_ms" ]]; then
            echo "Warning: Current processing time is 0 or empty, using default value"
            current_ms=10000
          fi
          
          if [[ "$previous_ms" == "0" || -z "$previous_ms" ]]; then
            echo "Warning: Previous processing time is 0 or empty, using default value"
            previous_ms=10000
          fi
          
          echo "Current processing time: $current_ms ms"
          echo "Previous processing time: $previous_ms ms"
          
          # Allow a 5% tolerance to account for test variability
          tolerance=1.05
          threshold=$(echo "$previous_ms * $tolerance" | bc)
          
          if (( $(echo "$current_ms > $threshold" | bc -l) )); then
            echo "::error::Performance regression detected! Processing time increased from $previous_ms ms to $current_ms ms (exceeds $threshold ms threshold)"
            exit 1
          else
            echo "No significant performance regression detected."
          fi

      - name: Run profile test multiple times for stability (informational only)
        if: false  # Disabled for now, enable when needed
        run: |
          if [ -d "backend/tests/profile" ]; then
            cd backend/tests/profile
            for i in {1..3}; do
              echo "Run $i"
              go run main.go || echo "Test run $i failed"
            done
          else
            echo "Profile test directory not found, skipping stability tests"
          fi

  # New job for code quality checks using golangci-lint
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.23'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m --no-config --disable=errcheck
          working-directory: backend

      - name: Ensure code formatting
        run: |
          cd backend
          go fmt ./...
          # Check if any files were changed after formatting
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Code is not properly formatted. Please run 'go fmt ./...'"
            git diff
            exit 1
          fi

  # New job for resource usage validation
  resource-validation:
    name: Resource Usage Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.23'

      - name: Validate memory usage
        run: |
          cd backend
          # Create test directory if it doesn't exist
          mkdir -p tests/resource
          
          # Create simple memory usage test script
          cat > tests/resource/memory_test.go << 'EOF'
          package resource
          
          import (
            "fmt"
            "testing"
            "runtime"
            "time"
          
            "github.com/pcristin/monad-faucet/internal/workers"
          )
          
          func TestMemoryUsage(t *testing.T) {
            // Get initial memory stats
            var m1, m2 runtime.MemStats
            runtime.ReadMemStats(&m1)
            
            // Run the worker pool setup that would be used in production
            config := &workers.PoolConfig{
              DepositWorkers: 5,
              CalculationWorkers: 5,
              DistributionWorkers: 5,
              DatabaseWorkers: 5,
              QueueSize: 100,
            }
            
            // Initialize worker pools (adjust this to match your actual initialization)
            manager := workers.NewManager(config)
            manager.Initialize()
            
            // Let it run for a moment
            time.Sleep(1 * time.Second)
            
            // Get final memory stats
            runtime.ReadMemStats(&m2)
            
            // Calculate memory increase
            memIncrease := float64(m2.Alloc - m1.Alloc) / 1024 / 1024
            
            fmt.Printf("Memory increase: %.2f MB\n", memIncrease)
            
            // Fail if memory usage exceeds threshold (50MB)
            const threshold = 50.0 // MB
            if memIncrease > threshold {
              t.Errorf("Memory usage increase of %.2f MB exceeds threshold of %.2f MB", 
                        memIncrease, threshold)
            }
            
            // Cleanup
            manager.StopAll()
          }
          EOF
          
          # Run the test with a timeout
          cd tests/resource
          go test -v -run TestMemoryUsage -timeout=30s || exit 1

      - name: Validate CPU usage
        run: |
          cd backend
          # Create simple CPU usage test script if it doesn't exist
          cat > tests/resource/cpu_test.go << 'EOF'
          package resource
          
          import (
            "context"
            "fmt"
            "math/big"
            "os"
            "runtime/pprof"
            "testing"
            "time"
          
            "github.com/ethereum/go-ethereum/common"
            "github.com/pcristin/monad-faucet/internal/bridge"
            "github.com/pcristin/monad-faucet/internal/interfaces"
            "github.com/pcristin/monad-faucet/internal/workers"
          )
          
          func TestCPUUsage(t *testing.T) {
            ctx := context.Background()
            
            // Create a CPU profile
            f, err := os.Create("cpu_profile.prof")
            if err != nil {
              t.Fatal(err)
            }
            defer f.Close()
            
            // Start CPU profiling
            if err := pprof.StartCPUProfile(f); err != nil {
              t.Fatal(err)
            }
            defer pprof.StopCPUProfile()
            
            // Setup mock bridge service
            mockConfig := &bridge.MockConfig{
              ProcessingDelay: 5 * time.Millisecond,
              SimulateLatency: true,
              MaxLatency:      20 * time.Millisecond,
            }
            mockBridge := bridge.NewMockBridgeService(mockConfig)
            
            // Start the mock bridge
            if err := mockBridge.Start(ctx); err != nil {
              t.Fatalf("Failed to start mock bridge: %v", err)
            }
            defer mockBridge.Stop()
            
            // Setup worker pool configuration
            workerPoolConfig := &workers.PoolConfig{
              DepositWorkers:      5,
              CalculationWorkers:  5,
              DistributionWorkers: 5,
              DatabaseWorkers:     5,
              QueueSize:           100,
            }
            
            // Setup worker manager
            manager := workers.NewManager(workerPoolConfig)
            manager.Initialize()
            manager.StartAll()
            defer manager.StopAll()
            
            // Create a deposit event channel
            depositEventCh := make(chan interfaces.DepositEvent, 100)
            mockBridge.SubscribeToDepositEvents(depositEventCh)
            defer mockBridge.UnsubscribeFromDepositEvents(depositEventCh)
            
            // Submit test tasks using mock bridge
            startTime := time.Now()
            
            // Process events from the mock bridge
            go func() {
              for event := range depositEventCh {
                // Create deposit tasks from events
                depositTask := workers.NewDepositTask(
                  event.DepositID.String(),
                  event.UserAddress.Hex(),
                  event.Amount.String(),
                  event.TxHash,
                )
                
                // Submit to worker pool
                manager.SubmitTask(workers.DepositPool, depositTask)
              }
            }()
            
            // Simulate deposits using the mock bridge
            numDeposits := 100
            for i := 0; i < numDeposits; i++ {
              mockBridge.SimulateDeposit(
                big.NewInt(int64(i)),                       // Deposit ID
                common.HexToAddress(fmt.Sprintf("0x%040x", i)), // User address
                big.NewInt(int64(i+1)*1000000000000000000), // Amount (i+1 ETH)
                fmt.Sprintf("0x%064x", i),                  // Transaction hash
              )
            }
            
            // Wait for processing to complete
            time.Sleep(1 * time.Second)
            
            // Simulate transaction confirmations
            for i := 0; i < numDeposits; i++ {
              txHash := fmt.Sprintf("0x%064x", i)
              mockBridge.SimulateTransactionConfirmation(txHash)
            }
            
            duration := time.Since(startTime)
            fmt.Printf("Processing time: %v (%.2f deposits/second)\n", 
                       duration, float64(numDeposits)/duration.Seconds())
            
            // Check if processing time exceeds threshold
            const threshold = 3 * time.Second
            if duration > threshold {
              t.Errorf("Processing time %v exceeds threshold %v", duration, threshold)
            }
          }
          EOF
          
          # Run the test with a timeout
          cd tests/resource
          go test -v -run TestCPUUsage -timeout=30s || exit 1

  # New job for load testing
  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.23'

      - name: Throughput Test
        run: |
          cd backend
          # Create throughput test directory if it doesn't exist
          mkdir -p tests/load
          
          # Create throughput test script
          cat > tests/load/throughput_test.go << 'EOF'
          package load
          
          import (
            "context"
            "database/sql"
            "fmt"
            "math/big"
            "os"
            "testing"
            "time"
          
            "github.com/ethereum/go-ethereum/common"
            "github.com/pcristin/monad-faucet/internal/bridge"
            _ "github.com/lib/pq"
            "github.com/pcristin/monad-faucet/internal/interfaces"
            "github.com/pcristin/monad-faucet/internal/workers"
          )
          
          func TestThroughput(t *testing.T) {
            // Skip in short mode
            if testing.Short() {
              t.Skip("Skipping throughput test in short mode")
            }
            
            ctx := context.Background()
            
            // Create minimal db connection using database/sql directly to avoid migrations
            connStr := "postgres://postgres:postgres@localhost:5432/testdb?sslmode=disable"
            db, err := sql.Open("postgres", connStr)
            if err != nil {
              t.Fatalf("Failed to create database connection: %v", err)
            }
            defer db.Close()
            
            // Test the connection
            if err := db.PingContext(ctx); err != nil {
              t.Fatalf("Cannot connect to database: %v", err)
            }
            
            // Create tables directly
            tableCreationSQL := `
              CREATE TABLE IF NOT EXISTS deposits (
                id SERIAL PRIMARY KEY,
                deposit_id VARCHAR(100) NOT NULL,
                wallet_address VARCHAR(42) NOT NULL,
                amount VARCHAR(78) NOT NULL,
                currency INTEGER NOT NULL,
                tx_hash VARCHAR(66) NOT NULL,
                block_number BIGINT NOT NULL DEFAULT 0,
                status VARCHAR(20) NOT NULL DEFAULT 'pending',
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              
              CREATE TABLE IF NOT EXISTS distributions (
                id SERIAL PRIMARY KEY,
                deposit_id VARCHAR(100) NOT NULL,
                wallet_address VARCHAR(42) NOT NULL,
                mon_amount VARCHAR(78) NOT NULL,
                status VARCHAR(20) NOT NULL DEFAULT 'pending',
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
              );`
            
            // Execute the table creation SQL
            _, err = db.ExecContext(ctx, tableCreationSQL)
            if err != nil {
              t.Logf("Note: Table creation gave: %v (this may be normal if tables exist)", err)
              // Continue anyway since error might just be that tables already exist
            }
            
            // Setup mock bridge service for high throughput testing
            mockConfig := &bridge.MockConfig{
              ProcessingDelay: 1 * time.Millisecond, // Fast for throughput testing
              SimulateLatency: true,
              MaxLatency:      5 * time.Millisecond, // Low latency for performance testing
            }
            mockBridge := bridge.NewMockBridgeService(mockConfig)
            
            // Start the mock bridge
            if err := mockBridge.Start(ctx); err != nil {
              t.Fatalf("Failed to start mock bridge: %v", err)
            }
            defer mockBridge.Stop()
            
            // Setup worker pool configuration for high throughput
            workerPoolConfig := &workers.PoolConfig{
              DepositWorkers:      10,
              CalculationWorkers:  10,
              DistributionWorkers: 10,
              DatabaseWorkers:     10,
              QueueSize:           1000,
            }
            
            // Setup worker manager
            manager := workers.NewManager(workerPoolConfig)
            manager.Initialize()
            manager.StartAll()
            defer manager.StopAll()
            
            // Create a deposit event channel
            depositEventCh := make(chan interfaces.DepositEvent, 1000)
            mockBridge.SubscribeToDepositEvents(depositEventCh)
            defer mockBridge.UnsubscribeFromDepositEvents(depositEventCh)
            
            // Process events from the mock bridge and submit to worker pool
            completedTasks := make(chan bool, 1000)
            go func() {
              for event := range depositEventCh {
                // Create deposit tasks from events
                depositTask := workers.NewDepositTask(
                  event.DepositID.String(),
                  event.UserAddress.Hex(),
                  event.Amount.String(),
                  event.TxHash,
                )
                
                // Set a custom processor that marks task as completed
                depositTask.SetCustomProcessor(func(task interface{}) error {
                  // Signal task completion
                  completedTasks <- true
                  return nil
                })
                
                // Submit to worker pool
                manager.SubmitTask(workers.DepositPool, depositTask)
              }
            }()
            
            // Use a smaller number of deposits for CI testing
            const numDeposits = 50 // Small number for CI testing
            
            startTime := time.Now()
            
            // Generate test deposits at maximum speed
            for i := 0; i < numDeposits; i++ {
              mockBridge.SimulateDeposit(
                big.NewInt(int64(i)),                       // Deposit ID
                common.HexToAddress(fmt.Sprintf("0x%040x", i)), // User address
                big.NewInt(int64(i+1)*1000000000000000000), // Amount (i+1 ETH)
                fmt.Sprintf("0x%064x", i),                  // Transaction hash
              )
              
              // Small delay to avoid overwhelming the system
              time.Sleep(5 * time.Millisecond)
            }
            
            // Wait for tasks to complete with progress reporting
            tasksCompleted := 0
            for tasksCompleted < numDeposits {
              select {
              case <-completedTasks:
                tasksCompleted++
                if tasksCompleted%10 == 0 || tasksCompleted == numDeposits {
                  fmt.Printf("Completed %d/%d tasks\n", tasksCompleted, numDeposits)
                }
              case <-time.After(15 * time.Second):
                fmt.Printf("Timed out waiting for tasks after completing %d/%d\n", 
                         tasksCompleted, numDeposits)
                // Calculate partial throughput based on what was completed
                partialThroughput := float64(tasksCompleted) / time.Since(startTime).Seconds()
                fmt.Printf("Partial throughput: %.2f deposits/second\n", partialThroughput)
                
                // Write partial results to a file
                os.WriteFile("throughput.log", []byte(fmt.Sprintf("%.2f", partialThroughput)), 0644)
                return // Exit test without failing
              }
            }
            
            endTime := time.Now()
            duration := endTime.Sub(startTime)
            
            // Calculate throughput (items per second)
            throughput := float64(numDeposits) / duration.Seconds()
            
            fmt.Printf("Throughput: %.2f deposits/second\n", throughput)
            
            // Write throughput to a file for the GitHub workflow
            os.WriteFile("throughput.log", []byte(fmt.Sprintf("%.2f", throughput)), 0644)
            
            // Very low threshold for CI environment
            const minThroughput = 1.0 // Just ensure it's positive
            if throughput < minThroughput {
              t.Errorf("Throughput %.2f deposits/second is below minimum threshold of %.2f", 
                        throughput, minThroughput)
            }
          }
          EOF
          
          # Run the throughput test
          cd tests/load
          go test -v -run TestThroughput -timeout=5m || exit 1
          
          # Check if throughput is acceptable
          if [ -f "throughput.log" ]; then
            throughput=$(cat throughput.log)
            echo "Measured throughput: $throughput deposits/second"
            
            # Validate against threshold
            threshold=100
            if (( $(echo "$throughput < $threshold" | bc -l) )); then
              echo "::error::Throughput below acceptable threshold! Got $throughput, expected at least $threshold deposits/second."
              exit 1
            fi
          else
            echo "::error::Throughput test failed to produce log file."
            exit 1
          fi
